---
# This repository's OWN settings. Two writers are built to apply the SAME six-layer
# merge of this file with the fleet layers: Vivswan/repo-platform's central
# settings-repos heal, and this repo's own apply-settings.yml, the hook for
# ci.yml's post-green slot: it renders the merge with repo-platform's
# scripts and applies it with the action at HEAD (dogfooding,
# APPLY_SETTING_TOKEN).
# Rendered once, repo-owned: template sync never rewrites it. Fleet defaults
# merge UNDER this file - keys here win, null opts out, labels replace by
# name, rulesets MERGE by name (rules append by type, nested objects merge
# key by key, other arrays replace wholesale). The fleet invariants (squash-only merging, the main
# and non-bypassable rulesets) sit ABOVE and cannot be overridden.
# Undeclared labels are deleted against the MERGED roster; undeclared
# rulesets are left alone.
#
# The fleet layers already carry everything this repository used to declare
# by hand: the repository policy block, the dependabot labels (dependencies,
# github_actions, javascript), the triage trio, the release-please labels,
# the nightly and fuzzer tracking labels (nightly-failure, fuzz-nightly),
# and the main ruleset with its code_scanning, code_quality, and
# copilot_code_review rules.

repository:
  description: "GitHub Action applying declarative repository settings: rulesets, labels, branch protection, and more. A loud, stateless Probot Settings replacement."
  # Declared even when empty: the apply manages only declared keys, so
  # this keeps it healing out-of-band edits.
  homepage: ""
  topics: github-action, repository-settings, settings-as-code, configuration-as-code, probot-settings, rulesets, branch-protection, labels
  private: false

labels:
  # e2e-nightly.yml's file-fuzz-issue.ts files under this label, so it must
  # survive the label sync.
  - name: e2e-fuzz
    color: "B60205"
    description: Automated e2e nightly failure

rulesets:
  # NARROWS the release-please module's release-tags ruleset: the fleet
  # declares it over `v*`, which would also freeze the moving major tag
  # (v2) that update-release.yml force-moves with the Actions token on
  # every release. A same-name ruleset merges key by key and an array
  # replaces wholesale, so this entry swaps only the include list and
  # inherits everything else (rules, enforcement, bypass) from the fleet.
  # The vX.Y.Z tags stay immutable: each points at a packaged commit (a
  # child of its release commit carrying the built bundle) that
  # template-sync workflow pins and release artifacts reference.
  - name: release-tags
    conditions:
      ref_name:
        include:
          - v*.*.*

  # The moving major tags (v1, v2) move on purpose - every release in the
  # line force-pushes them to its packaged commit - so no update rule, but
  # they must never vanish: a deleted major bricks every @v2 consumer at
  # once. fnmatch's * crosses dots, so v* also covers the vX.Y.Z tags;
  # that overlap is a harmless union with release-tags above.
  - name: major-release-tags
    target: tag
    enforcement: active
    conditions:
      ref_name:
        include:
          - v*
        exclude: []
    rules:
      - type: deletion
    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always
