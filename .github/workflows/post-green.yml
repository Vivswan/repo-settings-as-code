# Repo-owned: generated once by Vivswan/repo-platform, never overwritten by
# sync. ci.yml calls it after the all-green gate, before the release, with
# the judged sha. Pending runs coalesce (ci.yml's concurrency group), so
# jobs here reconcile current state and stay idempotent.

name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: The green main commit the calling run judged.
        required: true
        type: string

jobs:
  # No lane here: the called workflow holds apply-settings-<repo>. The apply
  # writes with APPLY_SETTING_TOKEN via inherit; the ceiling is contents: read.
  apply-settings:
    uses: ./.github/workflows/apply-settings.yml
    with:
      sha: ${{ inputs.sha }}
    secrets: inherit
