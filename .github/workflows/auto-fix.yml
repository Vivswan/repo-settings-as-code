# Repo-owned auto-fix: the commit-back fixes a PR can need. Main carries no
# bundle (lib/index.js is built where it runs), so no bundle rebuilds happen
# here; three fixes remain. lib/settings.schema.json is a committed build
# artifact, and CI fails when it drifts from src/ or the generator toolchain
# (a Dependabot generator bump changes the schema bytes on a branch nobody
# builds). README.md, COVERAGE.md, action.yml, and the docs pages under docs/
# carry generated regions that build:docs and build:action-docs render from the
# declarations and coverage-data.ts, and CI fails when they drift. src/upstream-gaps/ holds tripwire files that turn the typecheck
# red with TS2344 the moment @octokit/types ships a route a gap file declares
# as missing; graduate-upstream-gaps.ts retires the shipped files (deleting
# spec-documented ones, rewriting spec-lagging ones to spec-only gaps) and
# regenerates the gaps index. This workflow runs the graduation and the schema
# and docs regeneration on every same-repo PR that touches a fix input and pushes the
# result back to the PR branch; an already-clean tree gets no commit. A PR
# with unrelated type errors fails the build job here by design (the
# graduation script refuses to half-fix a red build), just as it fails CI's
# typecheck.
#
# Unlike dependabot-bun-lockfile.yml, regenerating the schema necessarily
# executes PR-controlled code, so the fix is computed in an unprivileged job
# and handed to the push job as a git patch staged from
# lib/settings.schema.json, the generated docs, and src/upstream-gaps/ only: no code from the PR
# runs on the runner that holds the write token, applying a patch executes
# nothing, and the push job re-checks the applied paths before committing.
# --ignore-scripts keeps lefthook (the prepare script) and dependency lifecycle
# scripts out of the build job, and the push job never installs anything, so
# no git hooks exist on either runner.
#
# Dependabot-triggered runs read the Dependabot secrets store, not the
# Actions one. Register REPO_PLATFORM_TOKEN in both stores: a push made
# with github.token starts no workflows, so without the token the fix
# commit does not re-run CI (the job then posts a PR comment and a
# warning annotation; close/reopen the PR to re-run), and on Dependabot
# bun PRs the token is a hard prerequisite - the stale lockfile fails
# the frozen install here until dependabot-bun-lockfile.yml's dedupe
# push retriggers this workflow, which only a real token does.

name: Auto Fix

on:
  pull_request:
    paths:
      - "src/**"
      - "lib/settings.schema.json"
      - "README.md"
      - "action.yml"
      - "docs/reference/undeclared-policy.md"
      - "docs/reference/permissions.md"
      - "docs/operate/check-mode.md"
      - ".github/scripts/gen-action-docs.ts"
      - "COVERAGE.md"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".bun-version"
      - ".github/scripts/gen-settings-schema.ts"
      - ".github/scripts/graduate-upstream-gaps.ts"
      - ".github/scripts/gen-gaps-index.ts"
      - ".github/scripts/gen-docs.ts"
      - ".github/scripts/lib/**"
      - ".github/scripts/coverage-data.ts"

permissions:
  contents: read

# Only the newest run per PR proceeds; a superseded run's push would race
# the new head (its push job skips on the head-moved guard anyway).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # Same-repo PRs only: the push job's token cannot push to a fork's
    # branch.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.rebuild.outputs.changed }}
      pruned: ${{ steps.rebuild.outputs.pruned }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # On a Dependabot PR whose lockfile still has the stale nested
      # entries dependabot-bun-lockfile.yml exists to fix, the frozen
      # install fails here; that workflow's dedupe push retriggers this
      # one on the fixed head.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Graduate upstream gaps octokit now ships
        shell: bash
        # Old branches cut before the graduate script landed lack it; the
        # schema regeneration below still runs for them.
        run: |
          if [ -f .github/scripts/graduate-upstream-gaps.ts ]; then
            bun .github/scripts/graduate-upstream-gaps.ts
          else
            echo "graduate script not on this branch; skipping"
          fi
      - name: Regenerate the schema and docs and stage the fix patch
        id: rebuild
        shell: bash
        run: |
          bun run build:schema
          # Old branches cut before the docs generator landed lack the
          # script; the schema regeneration above still runs for them.
          if [ -f .github/scripts/gen-docs.ts ]; then
            bun run build:docs
          fi
          if [ -f .github/scripts/gen-action-docs.ts ]; then
            bun run build:action-docs
          fi
          # Anything the earlier steps left staged is not this workflow's
          # fix: start from an empty index so the patch holds exactly the
          # allowed paths.
          git reset -q
          git add -A -- lib/settings.schema.json README.md COVERAGE.md action.yml \
            docs/reference/undeclared-policy.md docs/reference/permissions.md docs/operate/check-mode.md
          # Old branches cut before the gaps directory landed lack it, and
          # an unmatched pathspec would fail the add.
          if [ -d src/upstream-gaps ]; then
            git add -A -- src/upstream-gaps/
          fi
          git diff --cached --binary > "$RUNNER_TEMP/autofix.patch"
          if [ ! -s "$RUNNER_TEMP/autofix.patch" ]; then
            echo "schema and upstream gaps already fresh"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pruned=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # A patch touching src/ means gap files graduated (a schema-only
            # patch is plain generator drift); the push job picks the commit
            # subject from this. --quiet exits 1 on a staged src/ change,
            # and unlike piping --name-only into grep -q it cannot trip
            # pipefail on an early-exiting reader.
            if git diff --cached --quiet -- src/; then
              echo "pruned=false" >> "$GITHUB_OUTPUT"
            else
              echo "pruned=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/upload-artifact@v7
        if: steps.rebuild.outputs.changed == 'true'
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix.patch
          if-no-files-found: error

  push:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write # the sticky no-retrigger comment below
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      # The patch lands OUTSIDE the checkout so nothing in the work tree
      # can shadow or stage it.
      - uses: actions/download-artifact@v8
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix
      - name: Commit and push the fix
        id: push
        env:
          TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          CAN_RETRIGGER: ${{ secrets.REPO_PLATFORM_TOKEN != '' }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PRUNED: ${{ needs.build.outputs.pruned }}
        shell: bash
        run: |
          # The branch can move between the build and this push (a
          # Dependabot rebase, or dependabot-bun-lockfile.yml's dedupe
          # commit, which also invalidates the fix we built): the patch
          # belongs to HEAD_SHA only, and the newer head's own run owns
          # the rebuild.
          superseded() {
            git fetch --quiet origin "$HEAD_REF"
            [ "$(git rev-parse "origin/$HEAD_REF")" != "$HEAD_SHA" ]
          }
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::notice::head moved since the build; skipping the stale fix push"
            exit 0
          fi
          git apply --index --binary "$RUNNER_TEMP/autofix/autofix.patch"
          # The patch was cut on a runner PR code had run on, so treat it
          # as untrusted: refuse to commit anything it staged outside the
          # fix-owned paths. --no-renames keeps a staged rename listed
          # as its delete and add halves, so a rename OUT of a protected
          # path cannot hide behind an allowed destination.
          while IFS= read -r -d '' path; do
            case "$path" in
              lib/settings.schema.json | README.md | COVERAGE.md | action.yml | \
              docs/reference/undeclared-policy.md | docs/reference/permissions.md | \
              docs/operate/check-mode.md | src/upstream-gaps/*) ;;
              *)
                echo "::error::the fix patch staged '$path', outside lib/settings.schema.json, the generated docs (README.md, COVERAGE.md, action.yml, docs/reference/undeclared-policy.md, docs/reference/permissions.md, docs/operate/check-mode.md), and src/upstream-gaps/; refusing to push"
                exit 1
                ;;
            esac
          done < <(git diff --cached --no-renames --name-only -z)
          if git diff --cached --quiet; then
            echo "the fix patch stages nothing against the head commit; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          subject="build: regenerate settings schema"
          # A patch that stages only generated docs is docs drift alone.
          if git diff --cached --quiet -- lib/settings.schema.json src/upstream-gaps/; then
            subject="docs: regenerate generated docs"
          fi
          if [ "$PRUNED" = "true" ]; then
            subject="fix: graduate upstream gaps octokit now ships"
          fi
          # The body's [dependabot skip] keeps Dependabot rebasing and
          # updating the PR over this commit; without it Dependabot stops
          # touching a PR once someone else pushes to it.
          git commit --no-verify -m "$subject" -m "[dependabot skip]"
          # The lease pins the remote to the exact commit the fix was
          # built from, so a concurrent push (even a force-reset to an
          # ancestor) rejects this one instead of racing it.
          if ! git push --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"refs/heads/${HEAD_REF}"; then
            if superseded; then
              echo "::notice::head moved during the push; skipping the stale fix push"
              exit 0
            fi
            exit 1
          fi
          if [ "$CAN_RETRIGGER" = "true" ]; then
            exit 0
          fi
          # The fix landed via github.token, which starts no workflows:
          # this PR's checks will not re-run on the new head. Surface that
          # as a run annotation and, in the step below, on the PR; the push
          # itself succeeded.
          echo "notify=true" >> "$GITHUB_OUTPUT"
          echo "::warning::auto-fix pushed without REPO_PLATFORM_TOKEN - checks will not re-run on the new head; close/reopen the PR or register the token"
      # One sticky comment per PR (the header is its identity), updated in
      # place on later pushes; a failed post fails this step, not the push.
      - name: Tell the PR its checks will not re-run
        if: steps.push.outputs.notify == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: auto-fix
          message: >-
            Pushed an auto-fix commit with the default workflow token, which
            starts no workflows, so checks will not re-run on the new head.
            Close and reopen this PR to re-run them, or register
            `REPO_PLATFORM_TOKEN` (as an Actions secret, and as a Dependabot
            secret for Dependabot PRs) so future fixes re-trigger CI
            automatically.
