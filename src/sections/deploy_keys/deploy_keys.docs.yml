readme:
  endpoints: deploy keys list/create/delete
  notes: >-
    matched by title; the declared material is a PUBLIC key; immutable upstream, so changed entries
    are replaced
coverage:
  - area: "[Deploy keys](https://docs.github.com/en/rest/deploy-keys/deploy-keys)"
    notes: >-
      GET/POST /repos/{owner}/{repo}/keys and DELETE /repos/{owner}/{repo}/keys/{key_id}, matched by
      exact title (a declared title matching several live keys fails loudly naming their ids -
      GitHub does not enforce title uniqueness). The declared material is a PUBLIC key, so it is
      safe to keep in settings.yml (unlike secrets). Keys are immutable upstream (no update endpoint
      exists), so a changed key or declared read_only is applied as delete + recreate, the autolinks
      pattern (an UNDECLARED read_only survives the recreate: the live value is re-sent, so a
      rotation never widens access). Renaming a key while keeping its material cannot be applied -
      the one-repository-per-key rule makes the create collide with the live key - so the section
      fails loudly naming the live holder; delete or rename the live key on GitHub first. Material
      is compared as algorithm + base64 blob with the trailing comment ignored, because GitHub may
      strip or rewrite comments on storage - a raw-string compare would replace the key on every
      apply. A 422 on create can mean the public key is already attached to another repository (one
      repository per key, account-wide); the error says so. Undeclared keys are KEPT by default
      (deleting a live deploy key breaks whatever service authenticates with it, and deployment
      tooling installs its own keys); the wrapped `undeclared: delete` form opts into deletion.
schema:
  SettingsFile.deploy_keys: >-
    Deploy keys, matched by title. The declared material is a PUBLIC key, safe in a committed
    settings file. Keys are immutable upstream, so any change is applied as delete plus recreate.
    Undeclared keys are kept by default - deleting a live deploy key breaks whatever service
    authenticates with it, and deployment tooling installs its own keys - and the wrapped form can
    set `undeclared: delete`.
  DeployKeyConfig: >-
    One deploy key, matched by exact title (GitHub documents no case folding for titles). Extra
    fields pass through to the create call verbatim.
  DeployKeyConfig.title: The key title shown in the settings UI, the natural key.
  DeployKeyConfig.key: >-
    The PUBLIC key material, e.g. "ssh-ed25519 AAAAC3... comment". Public by nature, so it is safe
    in a committed file. Compared as algorithm + blob with the trailing comment ignored (GitHub may
    strip or rewrite comments on storage); keys are immutable upstream, so a changed key is applied
    as delete plus recreate.
  DeployKeyConfig.read_only: >-
    Whether the key is restricted to read-only access; GitHub defaults to false (read/write).
