readme:
  endpoints: code scanning default setup
  notes: >-
    `state`, `query_suite`, `languages`; needs Advanced Security on private repositories
coverage:
  - area: >-
      [Code scanning default setup](https://docs.github.com/en/rest/code-scanning/code-scanning)
    notes: >-
      GET/PATCH /repos/{owner}/{repo}/code-scanning/default-setup, PATCH body verbatim (state,
      query_suite, languages, runner_type, runner_label, threat_model). A 202 answer means GitHub
      rolls the change out in a configuration run, which the log names. Check compares declared keys
      only, languages as a set. Needs GitHub Advanced Security on private repositories; a 403 can
      mean that (or an archived repository) rather than a missing permission.
schema:
  SettingsFile.code_scanning_default_setup: Code scanning default setup (CodeQL).
  CodeScanningDefaultSetupConfig: PATCH /repos/{r}/code-scanning/default-setup, sent verbatim.
  CodeScanningDefaultSetupConfig.state: Turn default setup on ("configured") or off ("not-configured").
  CodeScanningDefaultSetupConfig.query_suite: CodeQL query suite to run.
  CodeScanningDefaultSetupConfig.languages: Languages to scan, compared as a set; GitHub auto-detects when omitted.
  CodeScanningDefaultSetupConfig.runner_type: Run on GitHub-hosted ("standard") or labeled self-hosted runners.
  CodeScanningDefaultSetupConfig.runner_label: Runner label when runner_type is "labeled"; null clears it.
  CodeScanningDefaultSetupConfig.threat_model: Whether to model local sources as threats in addition to remote ones.
