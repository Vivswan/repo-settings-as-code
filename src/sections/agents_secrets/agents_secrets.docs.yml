readme:
  endpoints: agents secrets list + public-key + sealed PUT + delete
  notes: as `actions_secrets`, over the Copilot agents secret store
coverage:
  - area: "[Copilot agents secrets](https://docs.github.com/en/rest/agents/secrets)"
    notes: >-
      GET /repos/{owner}/{repo}/agents/secrets, GET .../agents/secrets/public-key, sealed PUT/DELETE
      .../agents/secrets/{secret_name}. Same shape, sealing, and existence-only semantics as
      `actions_secrets`, over the Copilot agents secret store. (GET .../agents/organization-secrets
      is a read-only view of org-inherited secrets, not a reconciliation target.) Undeclared secrets
      kept by default; `undeclared: delete` opts into deletion.
schema:
  SettingsFile.agents_secrets: >-
    Repository Copilot agents secrets (the secret store Copilot coding agents read), written by name
    with values sealed client-side; each value is a whole-value `$NAME` reference to the action
    step's environment, never a literal. Undeclared secrets are kept by default (the wrapped form
    can set `undeclared: delete`; a deleted secret's value is unrecoverable).
  AgentsSecretConfig: >-
    One repository Copilot agents secret, matched by case-insensitive name (GitHub stores secret
    names uppercase). Keys other than name and value are rejected: the API body is built from the
    sealed value alone, so an extra key would silently do nothing.
