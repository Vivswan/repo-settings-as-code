readme:
  endpoints: interaction-limits + pulls creation-cap/bypass-list
  notes: >-
    re-arms the self-expiring limit every apply run; `null` clears it (base limit only); a 409
    (org/user-level limit overrides) becomes a note; the PR creation cap is persistent (PATCHed only
    on divergence, 405 where unavailable) and its bypass logins reconcile add/remove
coverage:
  - area: "[Interaction limits](https://docs.github.com/en/rest/interactions/repos)"
    notes: >-
      GET/PUT/DELETE /repos/{owner}/{repo}/interaction-limits, plus the two routed keys below.
      Limits self-expire (expiry tops out at six_months), so apply re-arms the declared limit on
      EVERY run and check mode reports drift once it lapses - schedule apply more often than the
      chosen expiry to keep it armed. The declared expiry is write-only (GitHub reads back only the
      computed expires_at), so check verifies the limit value, not the duration.
      `interaction_limits: null` clears a live repo-level limit - the base limit only, never the cap
      or bypass list below. In multi-repo mode, interaction_limits: null in a target is a defaults
      opt-out instead when the defaults file declares a non-null value, mirroring pages: null. A 409
      means an organization- or user-level limit overrides the repository's; writes surface that as
      a note, not a failure, while check mode still reports a mismatched declaration as drift - the
      org is the place to change it. `pull_request_creation_cap` routes to GET/PATCH
      /repos/{owner}/{repo}/interaction-limits/pulls/creation-cap: persistent desired state with no
      self-expiry (enabled plus max_open_pull_requests 1-1000, read back verbatim), so check diffs
      it exactly and apply PATCHes only on divergence - no re-arm. Where the cap is unavailable the
      endpoints answer 405, which apply surfaces as a note (like the 409) and check as honest drift.
      `pull_request_creation_bypass` routes to GET/PUT/DELETE
      /repos/{owner}/{repo}/interaction-limits/pulls/bypass-list and reconciles: apply DELETEs only
      the undeclared logins and then PUTs only the missing ones ({users: [logins]}, compared
      case-insensitively; removals go first because the list holds at most 100 users, which also
      caps the declaration), never a wholesale replace; a declared empty list removes everyone.
schema:
  SettingsFile.interaction_limits: >-
    Temporary interaction limits; null clears an active repo-level limit, and an absent key leaves
    whatever is live untouched. Limits self-expire (GitHub's expiry tops out at six_months), so
    apply re-arms the declared limit on every run and check mode reports drift once it lapses. The
    pull_request_creation_cap and pull_request_creation_bypass keys manage the persistent pull
    request creation cap and its bypass list instead; `interaction_limits: null` clears the base
    limit only and never touches them.
  InteractionLimitsConfig: >-
    The `interaction_limits:` section. The base object is sent verbatim to PUT
    /repos/{r}/interaction-limits minus the two routed keys below, which go to their own
    .../interaction-limits/pulls sub-endpoints instead. GitHub reads the base limit back as limit,
    origin, and the computed expires_at only. Declare at least one of `limit`,
    `pull_request_creation_cap`, or `pull_request_creation_bypass`.
  InteractionLimitsConfig.limit: >-
    Who may interact: "existing_users", "contributors_only", or "collaborators_only". Optional when
    only the pull-request keys below are declared; an omitted limit leaves the live base limit
    untouched.
  InteractionLimitsConfig.expiry: >-
    How long the limit lasts ("one_day" through "six_months"); GitHub defaults to one_day.
    Write-only: GitHub reports back the computed expires_at, never the duration, so check mode
    cannot verify this field and apply re-arms it on every run. Requires a sibling `limit`.
  InteractionLimitsConfig.pull_request_creation_cap: >-
    The pull request creation cap, routed to GET/PATCH
    /repos/{r}/interaction-limits/pulls/creation-cap. Unlike the base limit it is persistent desired
    state with no self-expiry and reads back verbatim, so check mode diffs it exactly and apply
    PATCHes only on divergence. max_open_pull_requests is 1-1000. On repositories where the cap is
    not available, the endpoints answer 405: apply surfaces that as a note, check mode as drift.
  InteractionLimitsConfig.pull_request_creation_cap.enabled: Whether the cap is enforced.
  InteractionLimitsConfig.pull_request_creation_cap.max_open_pull_requests: The maximum number of open pull requests one user may have (1-1000).
  InteractionLimitsConfig.pull_request_creation_bypass: >-
    User logins exempt from the pull request creation cap, routed to GET/PUT/DELETE
    /repos/{r}/interaction-limits/pulls/bypass-list and reconciled: apply removes the undeclared
    logins and then adds the missing ones (removals first - the list holds at most 100 users);
    logins compare case-insensitively. An empty list removes everyone. At most 100 logins.
