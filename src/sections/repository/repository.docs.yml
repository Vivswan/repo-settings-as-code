readme:
  endpoints: >-
    PATCH repo, PUT topics, vulnerability-alerts, automated-security-fixes,
    private-vulnerability-reporting, lfs, immutable-releases, GraphQL RepositoryFeatures +
    UpdateRepositoryFeatures
  notes: >-
    Probot repository payload plus `enable_*` feature toggles; `topics` as string or list;
    `enable_sponsorships` and `issue_creation_policy` (`all`/`collaborators_only`) route through
    GraphQL - REST has no surface for them; declared fields only, undeclared siblings untouched
coverage:
  - area: >-
      [Repository core settings](https://docs.github.com/en/rest/repos/repos) (name, description,
      homepage, visibility/private, has_issues, has_wiki, has_projects, has_discussions,
      merge-strategy toggles, squash/merge commit title+message, delete_branch_on_merge,
      allow_update_branch, allow_auto_merge, web_commit_signoff_required, is_template, archived,
      default_branch)
    notes: >-
      PATCH /repos/{owner}/{repo} verbatim passthrough (src/sections/repository/index.ts). Any field
      GitHub adds to the repo PATCH body, now or in any release to come, works day one with no
      action update, the forward-compatibility tenet's strongest case. Check mode = subsetDiff of
      declared keys against GET /repos.
  - area: >-
      [security_and_analysis](https://docs.github.com/en/rest/repos/repos) (GitHub Advanced
      Security, secret scanning, push protection, and any nested toggle GitHub adds)
    notes: >-
      Nested object inside the same PATCH /repos passthrough; flows through untouched. New
      sub-toggles GitHub adds (e.g. secret_scanning_ai_detection) work automatically. That includes
      the delegated-bypass surface: secret_scanning_delegated_bypass and
      secret_scanning_delegated_bypass_options (reviewers as {reviewer_id, reviewer_type, mode})
      nest here per the OpenAPI spec, covering the "who can bypass push protection" UI including
      per-actor Exempt mode, and the GET echoes them so check mode verifies them.
      secret_scanning_validity_checks likewise nests here (the dotcom docs omit it, but the GHEC
      flavor documents it and GitHub's validity-checks page points at this endpoint).
  - area: "[Topics](https://docs.github.com/en/rest/repos/repos)"
    keys: topics key
    notes: >-
      PUT /repos/{owner}/{repo}/topics. Only normalization: string-to-list splitting
      (normalizeTopics) and order-insensitive compare in check mode.
  - area: >-
      [Dependabot alerts](https://docs.github.com/en/rest/repos/repos) (vulnerability alerts)
    keys: enable_vulnerability_alerts
    notes: >-
      PUT/DELETE /repos/{owner}/{repo}/vulnerability-alerts; check mode probes GET and treats 404 as
      disabled. GitHub couples the dependency graph to this endpoint: the PUT/DELETE also
      enable/disable the graph as a side effect (the graph toggle itself has no API of its own; see
      No public API).
  - area: >-
      [Dependabot security updates](https://docs.github.com/en/rest/repos/repos) (automated security
      fixes)
    keys: enable_automated_security_fixes
    notes: >-
      PUT/DELETE /repos/{owner}/{repo}/automated-security-fixes; check handles both 204-empty and
      {enabled} body shapes.
  - area: "[Private vulnerability reporting](https://docs.github.com/en/rest/repos/repos)"
    keys: enable_private_vulnerability_reporting
    notes: >-
      PUT/DELETE /repos/{owner}/{repo}/private-vulnerability-reporting; check reads the {enabled}
      body from GET. Repositories where the feature does not apply (observed: private repos) answer
      404 or 422, which check treats as "not enabled" and disable treats as already done.
  - area: "[Git LFS enable/disable](https://docs.github.com/en/rest/repos/lfs)"
    keys: enable_git_lfs
    notes: >-
      PUT /repos/{owner}/{repo}/lfs (202) or DELETE (204). GitHub exposes NO endpoint to read the
      state back, so check mode emits a cannot-verify note instead of drift, apply re-asserts the
      declared state on every run, and the apply-mode preflight cannot probe it (a denied LFS write
      surfaces only after the section's other writes landed). A 403 can mean LFS is disabled
      account-wide or for the root of the repository network, or a credential without billing
      access, rather than a missing token grant; the error says so. GitHub's OpenAPI descriptor does
      not document this endpoint (real per the REST docs), so the e2e validator carries it in
      UNDOCUMENTED_ROUTES.
  - area: "[Immutable releases](https://docs.github.com/en/rest/repos/repos)"
    keys: enable_immutable_releases
    notes: >-
      GET/PUT/DELETE /repos/{owner}/{repo}/immutable-releases; check mode probes GET and treats 404
      as disabled. CAVEAT: enforced_by_owner in the GET body is read-only owner-level enforcement -
      both writes then answer 409, which apply surfaces as a note rather than a failure or a false
      change line, and check mode still reports a mismatched declaration as drift while saying apply
      cannot change it from the repository.
  - area: >-
      [Sponsor button](https://docs.github.com/en/graphql/reference/mutations#updaterepository) (the
      "Display a Sponsor button" checkbox under Settings > General > Features)
    keys: enable_sponsorships
    notes: >-
      GraphQL only: read via Repository.hasSponsorshipsEnabled, written via the updateRepository
      mutation's hasSponsorshipsEnabled input field - the PATCH /repos body carries no such field
      and no REST GET returns one. One RepositoryFeatures query serves this key,
      issue_creation_policy, and the node id the UpdateRepositoryFeatures mutation addresses; apply
      compares first, mutates only on divergence, and verifies the mutation's echoed state. A stored
      repository boolean independent of FUNDING.yml (repo content, out of scope).
  - area: >-
      [Issue creation
      policy](https://docs.github.com/en/graphql/reference/input-objects#updaterepositoryinput) (the
      Issues "Creation allowed by" control: everyone vs collaborators only)
    keys: issue_creation_policy
    notes: >-
      GraphQL only, sharing the Sponsor button's RepositoryFeatures query and updateRepository
      mutation: declared lowercase ("all"/"collaborators_only") and mapped to GitHub's
      ALL/COLLABORATORS_ONLY IssueCreationPolicy enum at the boundary. Live-probed before building:
      the REST PATCH ACCEPTS an issue_creation_policy field and silently ignores it (HTTP 200, no
      echo, no effect), and no REST GET carries it (the GET has pull_request_creation_policy but not
      the issue twin) - so GraphQL is the only read and write surface and the passthrough cannot
      absorb the key. A persistent two-value enum with full read-back, so check mode diffs it
      exactly.
  - area: "[Forking policy](https://docs.github.com/en/rest/repos/repos)"
    keys: allow_forking, fork-related PATCH fields
    notes: >-
      allow_forking and any other fork-policy fields on the repo object ride the PATCH passthrough.
      (Org-side 'members can fork' policy is org-scoped, out of scope.)
schema:
  SettingsFile.repository: >-
    Repo fields sent verbatim to PATCH /repos/{r}, plus the special keys RepositoryConfig documents.
  RepositoryConfig: >-
    The `repository:` section. Every field not documented here is sent verbatim to PATCH /repos/{r}
    (Probot parity), so current and future repo fields work unchanged; the keys below route to their
    own endpoints instead. Only declared keys are ever applied or compared.
  RepositoryConfig.topics: >-
    Repository topics, replaced wholesale via PUT /repos/{r}/topics; a comma-separated string or a
    list, lowercased and deduped.
  RepositoryConfig.enable_vulnerability_alerts: >-
    Dependabot alerts, via PUT/DELETE /repos/{r}/vulnerability-alerts. On read, 404 means off.
  RepositoryConfig.enable_automated_security_fixes: >-
    Dependabot security updates, via PUT/DELETE /repos/{r}/automated-security-fixes. On read, 404
    means off, as does a 200 body with enabled: false.
  RepositoryConfig.enable_private_vulnerability_reporting: >-
    Private vulnerability reporting, via PUT/DELETE /repos/{r}/private-vulnerability-reporting.
    Repositories where the feature does not apply (observed: private repos) read as off.
  RepositoryConfig.enable_git_lfs: >-
    Git LFS, via PUT/DELETE /repos/{r}/lfs. Write-only upstream: check mode cannot verify it, and
    apply re-asserts it on every run.
  RepositoryConfig.enable_immutable_releases: >-
    Immutable releases, via PUT/DELETE /repos/{r}/immutable-releases. On read, 404 means off. When
    the repository owner enforces immutable releases (enforced_by_owner in the GET body), writes
    answer 409 and the setting cannot be changed from the repository; apply reports that as a note
    instead of a change.
  RepositoryConfig.enable_sponsorships: >-
    Display a Sponsor button on the repository, via the GraphQL updateRepository mutation
    (hasSponsorshipsEnabled) - GraphQL is the setting's only read and write surface (the REST repo
    PATCH and GET carry no such field). A stored repository toggle independent of any FUNDING.yml
    content.
  RepositoryConfig.issue_creation_policy: >-
    Who may create issues: "all" (everyone) or "collaborators_only", mapped to GitHub's
    ALL/COLLABORATORS_ONLY GraphQL enum at the API boundary. GraphQL-only upstream
    (Repository.issueCreationPolicy and the updateRepository mutation): the REST repo PATCH accepts
    an issue_creation_policy field and silently ignores it, and no REST GET returns it.
  RepositoryConfig.*: Everything else passes through to PATCH /repos/{r} verbatim.
