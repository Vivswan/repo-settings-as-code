readme:
  endpoints: Copilot agents variables CRUD
  notes: as `actions_variables`, over the Copilot agents variable store
coverage:
  - area: "[Copilot agents variables](https://docs.github.com/en/rest/agents/variables)"
    notes: >-
      GET/POST /repos/{owner}/{repo}/agents/variables and PATCH/DELETE
      /repos/{owner}/{repo}/agents/variables/{name}: same upsert-by-uppercase-name semantics, exact
      check-mode diffing, and 30-item per_page cap as `actions_variables`, over the Copilot agents
      variable store. (GET .../agents/organization-variables is the read-only org-inherited view,
      out of scope.) Undeclared variables are DELETED by default, kept as notes under the wrapped
      `undeclared: keep` form. CAVEAT: GitHub auto-migrated values from the older `copilot` Actions
      environment into this store, so a repository can hold agents variables nobody created here -
      run `mode: check` first (it lists them as deletion drift) before the first apply, or declare
      `undeclared: keep`.
schema:
  SettingsFile.agents_variables: >-
    Copilot agents repository variables (the plain-text configuration Copilot coding agents read),
    upserted by name; undeclared ones are DELETED by default (the wrapped form can set `undeclared:
    keep`). Names are case-insensitive (GitHub stores them uppercased). Values are plain text BY
    DESIGN - variables are readable configuration, which is what makes check-mode diffing possible;
    secrets are write-only material and deliberately not this section.
  AgentsVariableConfig: One Copilot agents repository variable, matched by case-insensitive name.
  AgentsVariableConfig.name: >-
    The variable name, the natural key; case-insensitive (stored uppercased by GitHub).
  AgentsVariableConfig.value: The plain-text value Copilot coding agents read.
