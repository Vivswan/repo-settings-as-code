readme:
  endpoints: dependabot secrets list + public-key + sealed PUT + delete
  notes: as `actions_secrets`, over the Dependabot secret store
coverage:
  - area: "[Dependabot secrets](https://docs.github.com/en/rest/dependabot/secrets)"
    notes: >-
      GET /repos/{owner}/{repo}/dependabot/secrets, GET .../dependabot/secrets/public-key, sealed
      PUT/DELETE .../dependabot/secrets/{secret_name}. Same shape, sealing, and existence-only
      semantics as `actions_secrets`, over the Dependabot secret store (private-registry credentials
      Dependabot uses). Undeclared secrets kept by default; `undeclared: delete` opts into deletion.
schema:
  SettingsFile.dependabot_secrets: >-
    Repository Dependabot secrets (private-registry credentials Dependabot uses), written by name
    with values sealed client-side; each value is a whole-value `$NAME` reference to the action
    step's environment, never a literal. Undeclared secrets are kept by default (the wrapped form
    can set `undeclared: delete`; a deleted secret's value is unrecoverable).
  DependabotSecretConfig: >-
    One repository Dependabot secret, matched by case-insensitive name (GitHub stores secret names
    uppercase). Keys other than name and value are rejected: the API body is built from the sealed
    value alone, so an extra key would silently do nothing.
