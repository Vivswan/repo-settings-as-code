readme:
  endpoints: labels CRUD
  notes: upsert by name (rename via `new_name`); the delete-by-default is Probot parity
coverage:
  - area: "[Labels](https://docs.github.com/en/rest/issues/labels)"
    notes: >-
      Full CRUD on /repos/{owner}/{repo}/labels: upsert by name, rename via new_name (Probot
      parity), undeclared labels DELETED loudly by default; the wrapped `undeclared: keep` form
      keeps them, each surfaced as a note.
schema:
  SettingsFile.labels: >-
    Issue/PR labels; undeclared labels are DELETED by default (Probot parity; the wrapped form can
    set `undeclared: keep`).
  LabelConfig: One label, matched to the live repo by name.
  LabelConfig.name: The label name, the natural key.
  LabelConfig.color: Hex color, with or without the leading "#".
  LabelConfig.description: Short explanation shown in the label picker.
  LabelConfig.new_name: "Probot compat: rename an existing label."
